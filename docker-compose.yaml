name: ecommerce-agent

services:
  frontend:
    build:
      context: ./frontend
    image: ecommerce-agent/frontend
    container_name: frontend
    env_file:
      - ./frontend/.env
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: pnpm dev
    depends_on:
      - backend
  
  backend:
    build:
      context: ./backend
    image: ecommerce-agent/backend
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:18
    container_name: postgres_db
    ports:
      - 5432:5432
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_venv:
  postgres_data:
